name: Offline integration kit checks
on:
  push:
  # A pull request that changes only the bot-owned release files (the pins, the
  # rebuilt plugin and the next release's version bump with its changelog
  # section) is the release workflow's own: its refresh job already ran check
  # and test on them and its verify jobs run the real setup on three OSes.
  # GitHub never starts jobs for a pull_request run that github-actions[bot]
  # opened, so without this filter each such pull request showed a job-less run
  # that failed when the merge deleted bot/releases. Any pull request touching
  # other files still runs in full; every push still runs it.
  pull_request:
    paths-ignore:
      - config/releases.json
      - config/signatures.json
      - plugins/storytold/**
      - packaging/project.json
      - CHANGELOG.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storytold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check.py
      - run: python scripts/test.py
      - run: python scripts/build.py check
      - run: python scripts/build.py plugin
      - run: python scripts/build.py source
  sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: 'python -m pip install --isolated --require-hashes --only-binary=:all: -r requirements-probe.lock'
      - run: python scripts/test_sdk.py
