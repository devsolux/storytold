name: Daily Craft release refresh
# Refreshes config/releases.json from the latest upstream releases, signs each
# pinned CLI keyless with this workflow's Sigstore identity, rebuilds the plugin
# and opens (or updates) one pull request on the bot/releases branch. A verify
# matrix then runs the real `setup` on Linux, Windows and macOS runners. Nothing
# reaches main without that pull request; set the repository variable
# STORYTOLD_AUTO_MERGE=true to let a fully green run merge it.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storytold-releases
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - name: Refresh manifest from upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh_releases.py
      - name: Sign newly pinned CLI binaries (keyless)
        run: python scripts/sign_releases.py
      - run: python scripts/build.py build
      - run: python scripts/check.py
      - run: python scripts/test.py
      - name: Commit to bot/releases and open or update the pull request
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- config/releases.json config/signatures.json plugins/storytold; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No release changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B bot/releases
          git add config/releases.json config/signatures.json plugins/storytold
          git commit -m "Refresh Craft release pins and Sigstore bundles ($(date -u +%F))"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bot/releases
          echo "changed=true" >> "$GITHUB_OUTPUT"
          body="Automated refresh of config/releases.json and config/signatures.json from the latest upstream releases on $(date -u +%F). Review the diff: a changed app needs its card and smoke tool rechecked at the new tag. The verify jobs below ran the real setup on Linux, Windows and macOS runners."
          open_pr=$(gh pr list --head bot/releases --state open --json number --jq '.[0].number')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body "$body" || echo "::warning::Could not update the pull request body."
          elif ! gh pr create --base main --head bot/releases --title "Refresh Craft release pins ($(date -u +%F))" --body "$body"; then
            echo "::warning::bot/releases was pushed but no pull request could be opened. Enable 'Allow GitHub Actions to create and approve pull requests' under Settings > Actions > General, or open it yourself: https://github.com/${GITHUB_REPOSITORY}/compare/main...bot/releases"
          fi
  verify:
    needs: refresh
    if: always() && needs.refresh.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.changed == 'true' && 'bot/releases' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - name: Every pinned archive must have a Sigstore bundle before strict verification
        shell: bash
        run: python scripts/check_bundles.py
      - name: Real setup on this runner with strict provenance (download, verify, cosign, pin, probe; no host CLI here)
        shell: bash
        run: python storytold.py setup --all --acknowledge-unconfined
  merge:
    needs: [refresh, verify]
    if: needs.refresh.outputs.changed == 'true' && vars.STORYTOLD_AUTO_MERGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the reviewed-by-CI pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head bot/releases --state open --json number --jq '.[0].number')
          if [ -n "$open_pr" ]; then
            gh pr merge "$open_pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          else
            echo "::warning::No pull request exists for bot/releases; nothing merged."
          fi
